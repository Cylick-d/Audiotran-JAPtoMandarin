[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotran"
version = "0.1.0"
description = "Desktop audio subtitle tool"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9", "faster-whisper>=1.2.0"]

[project.scripts]
audiotran = "audiotran.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
